<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Unit 777 — Daily work tracking and invoicing for field service professionals.">
  <title>Unit 777 — Work Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <div id="toast-container"></div>

  <!-- ═══════════ Auth View ═══════════ -->
  <div id="auth-view" class="view">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="logo-icon">
            <svg viewBox="0 0 40 40" fill="none"><rect x="4" y="4" width="32" height="32" rx="8" stroke="currentColor" stroke-width="2.5"/><path d="M14 14h12M14 20h12M14 26h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </div>
          <h1>Unit 777</h1>
          <p class="auth-subtitle">Work Tracking & Invoicing</p>
        </div>
        <div class="auth-tabs">
          <button id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">Sign In</button>
          <button id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">Register</button>
        </div>
        <form id="auth-form" onsubmit="handleAuth(event)">
          <div class="form-group">
            <label for="auth-username">Username</label>
            <input type="text" id="auth-username" placeholder="Enter username" autocomplete="username" required minlength="3">
          </div>
          <div class="form-group">
            <label for="auth-password">Password</label>
            <input type="password" id="auth-password" placeholder="Enter password" autocomplete="current-password" required minlength="6">
          </div>
          <div id="auth-error" class="auth-error" style="display:none"></div>
          <button type="submit" id="auth-submit" class="btn btn-primary btn-full">
            <span id="auth-btn-text">Sign In</span>
            <span id="auth-btn-loading" class="spinner" style="display:none"></span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ═══════════ Dashboard View ═══════════ -->
  <div id="dashboard-view" class="view" style="display:none">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-brand">
          <div class="logo-icon logo-icon-sm">
            <svg viewBox="0 0 40 40" fill="none"><rect x="4" y="4" width="32" height="32" rx="8" stroke="currentColor" stroke-width="2.5"/><path d="M14 14h12M14 20h12M14 26h8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>
          </div>
          <span class="topbar-title">Unit 777</span>
        </div>
        <div class="topbar-actions">
          <!-- Map Dropdown -->
          <div class="map-dropdown-wrap" id="map-dropdown-wrap">
            <button class="map-dropdown-trigger" id="map-dropdown-trigger" onclick="toggleMapDropdown()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
              <span id="map-trigger-label">Maps</span>
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="map-dropdown" id="map-dropdown" style="display:none"></div>
          </div>
          <!-- Theme Toggle -->
          <button id="theme-toggle" class="btn-icon theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme">
            <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          </button>
          <span id="username-display" class="username-badge"></span>
          <button id="logout-btn" class="btn btn-ghost" onclick="logout()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span class="logout-text">Logout</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Tab bar removed — using dropdown in header instead -->

    <main class="main-content">
      <div class="container">
        <div class="dashboard-header">
          <div>
            <h2 class="dashboard-title" id="project-heading">Work Entries</h2>
            <p class="dashboard-subtitle">Track your daily field service work</p>
          </div>
          <button id="add-date-group-btn" class="btn btn-primary" onclick="addDateGroup()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            New Work Day
          </button>
        </div>
        <div id="date-groups-container"></div>
        <div id="empty-state" class="empty-state" style="display:none">
          <div class="empty-icon"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>
          <h3>No work entries yet</h3>
          <p>Click "New Work Day" to start tracking your first day.</p>
        </div>
        <div id="no-project-state" class="empty-state" style="display:none">
          <div class="empty-icon"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></div>
          <h3>No maps yet</h3>
          <p>Open the <strong>Maps</strong> dropdown in the header and click <strong>+ New Map</strong>.</p>
        </div>
      </div>
    </main>
  </div>

  <!-- ═══════════ Edit Mode Modal ═══════════ -->
  <div id="edit-modal" class="edit-modal" style="display:none">
    <div class="edit-modal-header">
      <div class="edit-modal-title-area">
        <div class="edit-modal-titles">
          <span class="edit-modal-map-label" id="edit-modal-map"></span>
          <span id="edit-modal-date">Editing Day</span>
        </div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="closeEditModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="20 6 9 17 4 12"/></svg>
        Save & Exit
      </button>
    </div>
    <div id="edit-modal-body" class="edit-modal-body"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
